<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SWF Resurrect output</title>
    <style>
      html, body { margin: 0; height: 100%; background: #202020; }
      body { display: flex; align-items: center; justify-content: center; }
      canvas { max-width: 100%; max-height: 100%; touch-action: none; }
    </style>
  </head>
  <body>
    <script>
      // Load_Error_Report: a module that fails to evaluate never reaches main.ts, so this runs first.
      (function () {
        function fail(reason) {
          var text = reason && reason.message ? reason.message : String(reason);
          var o = window.__swfResurrect;
          if (o && o.ready) return;
          window.__swfResurrect = { ready: false, error: text };
        }
        window.addEventListener('error', function (e) { fail(e.error || e.message); });
        window.addEventListener('unhandledrejection', function (e) { fail(e.reason); });
      })();
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
