<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Original SWF in Ruffle</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070b;
        color: #ebe7dc;
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #stage {
        width: 100%;
        height: 100%;
      }
      #stage ruffle-player {
        width: 100%;
        height: 100%;
        display: block;
      }
      #message {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        text-align: center;
        color: #a4adb8;
      }
      #message[hidden] {
        display: none;
      }
      #message.is-error {
        color: #ff9a8a;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <p id="message">Summoning the ghost...</p>
    <!-- Ruffle is served from this server (node_modules/@ruffle-rs/ruffle), never from a CDN. -->
    <script src="/ruffle-frame.js"></script>
  </body>
</html>
